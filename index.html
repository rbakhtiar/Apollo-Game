<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APOLLO GAME OS</title>

<style>
:root{
    --bg:#07090d;
    --bg2:#0c1016;
    --panel:#111720;
    --panel2:#171e29;
    --panel3:#202a38;
    --border:rgba(255,255,255,.08);
    --text:#f4f6fa;
    --muted:#818b9b;
    --blue:#62adff;
    --blue2:#367fe5;
    --purple:#8a72ff;
    --green:#51d59a;
    --red:#ff6574;
    --shadow:0 25px 70px rgba(0,0,0,.5);
}

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    color:var(--text);
    background:
        radial-gradient(circle at 80% 5%,rgba(62,132,230,.14),transparent 30%),
        radial-gradient(circle at 5% 95%,rgba(117,76,200,.11),transparent 30%),
        var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

/* BOOT */

#boot{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#030507;
}

.boot-box{
    width:400px;
    text-align:center;
}

.boot-logo{
    width:100px;
    height:100px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #75b8ff;
    border-radius:50%;
    color:#9bcaff;
    font-size:38px;
    font-weight:800;
    box-shadow:0 0 45px rgba(72,155,255,.28);
}

.boot-title{
    margin-top:25px;
    font-size:39px;
    font-weight:800;
    letter-spacing:8px;
}

.boot-subtitle{
    margin-top:7px;
    color:#606b7c;
    font-size:9px;
    letter-spacing:4px;
}

.boot-bar{
    height:4px;
    margin-top:45px;
    overflow:hidden;
    background:#1b222c;
    border-radius:20px;
}

.boot-progress{
    width:0;
    height:100%;
    background:linear-gradient(90deg,var(--blue2),var(--purple));
    animation:boot 3.5s forwards;
}

@keyframes boot{
    to{width:100%}
}

.boot-status{
    margin-top:14px;
    color:#687486;
    font-size:11px;
}

/* APP */

#app{
    display:none;
    width:100%;
    height:100%;
}

/* TOP */

.topbar{
    height:46px;
    display:flex;
    align-items:center;
    padding:0 18px;
    background:rgba(7,10,15,.78);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(30px);
}

.window-controls{
    display:flex;
    gap:8px;
    margin-right:20px;
}

.window-control{
    width:11px;
    height:11px;
    background:#353d49;
    border-radius:50%;
}

.brand{
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
}

.top-center{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    color:#7e8999;
    font-size:11px;
}

.top-right{
    margin-left:auto;
    display:flex;
    gap:18px;
    color:#aab3c0;
    font-size:11px;
}

#gamingIndicator{
    transition:.2s;
}

/* MAIN */

.main{
    display:flex;
    width:100%;
    height:calc(100% - 46px);
}

/* SIDEBAR */

.sidebar{
    width:235px;
    flex-shrink:0;
    padding:28px 13px;
    background:linear-gradient(180deg,#0d1219,#080b10);
    border-right:1px solid var(--border);
}

.logo-area{
    padding:0 13px 25px;
}

.logo-name{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
}

.logo-caption{
    margin-top:5px;
    color:#626e80;
    font-size:9px;
    letter-spacing:2px;
}

.nav-label{
    margin:16px 13px 8px;
    color:#566171;
    font-size:9px;
    font-weight:700;
    letter-spacing:1.6px;
}

.nav button{
    width:100%;
    display:flex;
    align-items:center;
    padding:11px 13px;
    margin-bottom:4px;
    color:#96a1b1;
    background:transparent;
    border:1px solid transparent;
    border-radius:9px;
    cursor:pointer;
    text-align:left;
    font-size:12px;
    transition:.18s;
}

.nav button:hover{
    color:white;
    background:rgba(255,255,255,.04);
}

.nav button.active{
    color:white;
    background:linear-gradient(90deg,rgba(72,142,231,.18),rgba(72,142,231,.03));
    border-color:rgba(100,174,255,.13);
}

.nav-icon{
    width:27px;
    color:#6f7c8f;
    font-size:10px;
    font-weight:800;
}

.nav button.active .nav-icon{
    color:var(--blue);
}

/* CONTENT */

.content{
    flex:1;
    overflow-y:auto;
    padding:38px 45px 110px;
}

.content::-webkit-scrollbar{
    width:8px;
}

.content::-webkit-scrollbar-thumb{
    background:#252d39;
    border-radius:10px;
}

/* HEADER */

.page-header{
    margin-bottom:25px;
}

.page-header h1{
    margin:0;
    font-size:30px;
    letter-spacing:-.8px;
}

.page-header p{
    margin:7px 0 0;
    color:var(--muted);
    font-size:13px;
}

/* HERO */

.hero{
    min-height:245px;
    position:relative;
    display:flex;
    align-items:center;
    overflow:hidden;
    padding:38px;
    background:
        radial-gradient(circle at 85% 35%,rgba(88,161,255,.2),transparent 30%),
        linear-gradient(120deg,#161f2d,#0f141c);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
}

.hero:after{
    content:"APOLLO";
    position:absolute;
    right:-45px;
    bottom:-55px;
    color:rgba(255,255,255,.025);
    font-size:150px;
    font-weight:900;
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-tag{
    color:var(--blue);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
}

.hero h2{
    max-width:650px;
    margin:9px 0 8px;
    font-size:38px;
    letter-spacing:-1.5px;
}

.hero p{
    max-width:550px;
    color:var(--muted);
    line-height:1.6;
}

.primary{
    padding:12px 19px;
    color:white;
    background:linear-gradient(135deg,var(--blue2),var(--purple));
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
    box-shadow:0 8px 25px rgba(64,132,226,.22);
    transition:.2s;
}

.primary:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

/* CARDS */

.stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin-top:18px;
}

.card{
    padding:19px;
    background:linear-gradient(145deg,rgba(26,32,43,.94),rgba(18,23,31,.94));
    border:1px solid var(--border);
    border-radius:14px;
}

.card-label{
    color:#788394;
    font-size:9px;
    font-weight:700;
    letter-spacing:1.4px;
}

.card-value{
    margin-top:9px;
    font-size:22px;
    font-weight:700;
}

.card-sub{
    margin-top:5px;
    color:#667183;
    font-size:10px;
}

/* STORE */

.store-toolbar{
    display:flex;
    gap:9px;
    margin-bottom:18px;
}

.search{
    flex:1;
    padding:12px 14px;
    color:white;
    background:#10151d;
    border:1px solid var(--border);
    border-radius:9px;
    outline:none;
}

.search:focus{
    border-color:rgba(103,177,255,.4);
}

.select{
    min-width:150px;
    padding:10px 12px;
    color:#dbe1e8;
    background:#10151d;
    border:1px solid var(--border);
    border-radius:8px;
}

.store-status{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    color:#788393;
    font-size:11px;
}

/* GAMES */

.game-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.game{
    min-height:185px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
    overflow:hidden;
    padding:18px;
    background:
        radial-gradient(circle at 80% 10%,rgba(90,160,255,.13),transparent 35%),
        linear-gradient(145deg,#192333,#11161f);
    border:1px solid var(--border);
    border-radius:14px;
    transition:.2s;
}

.game:hover{
    transform:translateY(-3px);
    border-color:rgba(103,175,255,.25);
    box-shadow:0 18px 40px rgba(0,0,0,.38);
}

.game-number{
    position:absolute;
    top:13px;
    right:14px;
    color:#4e5b6d;
    font-size:9px;
}

.game-category{
    color:#7894b4;
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
}

.game h3{
    margin:7px 0 4px;
    font-size:15px;
}

.game-meta{
    color:#6e7888;
    font-size:10px;
}

.game-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
}

.play{
    padding:8px 14px;
    color:#0c1017;
    background:#f0f3f7;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-size:9px;
    font-weight:800;
}

.secondary{
    padding:8px 11px;
    color:#dbe1e9;
    background:#252d3a;
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
    font-size:9px;
}

/* PAGINATION */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin-top:25px;
}

.page-button{
    min-width:35px;
    height:32px;
    color:#aab3c0;
    background:#151b24;
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
}

.page-button:hover{
    color:white;
    background:#222b38;
}

.page-button.active{
    color:white;
    background:#347ddd;
}

/* SETTINGS */

.settings-layout{
    display:grid;
    grid-template-columns:210px 1fr;
    min-height:520px;
    overflow:hidden;
    background:rgba(16,21,29,.75);
    border:1px solid var(--border);
    border-radius:16px;
}

.settings-menu{
    padding:13px;
    background:rgba(10,14,20,.55);
    border-right:1px solid var(--border);
}

.settings-menu button{
    width:100%;
    padding:11px 12px;
    margin-bottom:3px;
    color:#8f99a9;
    background:transparent;
    border:0;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
    font-size:11px;
}

.settings-menu button.active{
    color:white;
    background:#202a38;
}

.settings-content{
    padding:28px;
}

.settings-content h2{
    margin:0;
    font-size:21px;
}

.settings-description{
    margin:7px 0 25px;
    color:#788393;
    font-size:11px;
}

.setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 0;
    border-bottom:1px solid var(--border);
}

.setting-title{
    font-size:12px;
}

.setting-help{
    margin-top:4px;
    color:#697384;
    font-size:10px;
}

.toggle{
    width:42px;
    height:23px;
    position:relative;
    flex-shrink:0;
    background:#303845;
    border-radius:20px;
    cursor:pointer;
}

.toggle:after{
    content:"";
    position:absolute;
    width:17px;
    height:17px;
    left:3px;
    top:3px;
    background:#dce1e8;
    border-radius:50%;
    transition:.2s;
}

.toggle.on{
    background:var(--blue2);
}

.toggle.on:after{
    left:22px;
}

.setting-select{
    padding:9px 11px;
    color:#dbe1e8;
    background:#10151d;
    border:1px solid var(--border);
    border-radius:7px;
}

.range{
    width:180px;
}

/* PERFORMANCE */

.performance-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.performance-value{
    margin-top:10px;
    font-size:28px;
    font-weight:700;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:9000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(7px);
}

.modal-box{
    width:min(680px,90vw);
    max-height:85vh;
    overflow:auto;
    padding:28px;
    background:#141a23;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 35px 100px rgba(0,0,0,.7);
}

.close{
    float:right;
    width:29px;
    height:29px;
    color:#aab3c0;
    background:#252c37;
    border:0;
    border-radius:7px;
    cursor:pointer;
}

/* MINI GAME */

.game-screen{
    width:100%;
    height:360px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    background:#06090e;
    border:1px solid var(--border);
    border-radius:12px;
}

.game-canvas{
    max-width:100%;
    max-height:100%;
}

/* DOCK */

.dock{
    position:fixed;
    left:50%;
    bottom:16px;
    z-index:3000;
    display:flex;
    gap:5px;
    padding:7px;
    transform:translateX(-50%);
    background:rgba(17,21,29,.88);
    border:1px solid var(--border);
    border-radius:14px;
    backdrop-filter:blur(25px);
    box-shadow:var(--shadow);
}

.dock button{
    width:50px;
    height:39px;
    color:#9ba5b5;
    background:transparent;
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-size:8px;
    font-weight:700;
}

.dock button:hover{
    color:white;
    background:#252e3b;
}

/* TOAST */

.toast{
    position:fixed;
    top:65px;
    right:22px;
    z-index:10000;
    padding:12px 17px;
    color:#e9edf2;
    background:#1b222d;
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:var(--shadow);
    font-size:11px;
}

/* RESPONSIVE */

@media(max-width:1100px){
    .game-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .stat-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .sidebar{
        width:65px;
    }

    .logo-area,
    .nav-label{
        display:none;
    }

    .nav button{
        justify-content:center;
    }

    .nav-text{
        display:none;
    }

    .nav-icon{
        width:auto;
    }

    .content{
        padding:25px 20px 100px;
    }

    .game-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .settings-layout{
        grid-template-columns:1fr;
    }

    .settings-menu{
        display:flex;
        overflow-x:auto;
        border-right:0;
        border-bottom:1px solid var(--border);
    }

    .settings-menu button{
        min-width:120px;
    }
}

@media(max-width:550px){
    .game-grid{
        grid-template-columns:1fr;
    }

    .stat-grid{
        grid-template-columns:1fr;
    }

    .top-center{
        display:none;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     BOOT
====================================================== -->

<div id="boot">

    <div class="boot-box">

        <div class="boot-logo">
            A
        </div>

        <div class="boot-title">
            APOLLO
        </div>

        <div class="boot-subtitle">
            GAME OPERATING SYSTEM
        </div>

        <div class="boot-bar">
            <div class="boot-progress"></div>
        </div>

        <div
            id="bootStatus"
            class="boot-status"
        >
            Initializing Apollo Core
        </div>

    </div>

</div>


<!-- ======================================================
     APPLICATION
====================================================== -->

<div id="app">

<header class="topbar">

    <div class="window-controls">
        <span class="window-control"></span>
        <span class="window-control"></span>
        <span class="window-control"></span>
    </div>

    <div class="brand">
        APOLLO
    </div>

    <div class="top-center">
        Game Operating System
    </div>

    <div class="top-right">

        <span id="gamingIndicator">
            Balanced
        </span>

        <span id="clock">
            --:--
        </span>

    </div>

</header>


<div class="main">

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo-area">

        <div class="logo-name">
            APOLLO
        </div>

        <div class="logo-caption">
            GAMING COMMAND CENTER
        </div>

    </div>


    <div class="nav-label">
        SYSTEM
    </div>


    <nav class="nav">

        <button
            class="active"
            onclick="navigate('home',this)"
        >
            <span class="nav-icon">H</span>
            <span class="nav-text">Home</span>
        </button>


        <button
            onclick="navigate('library',this)"
        >
            <span class="nav-icon">G</span>
            <span class="nav-text">Game Library</span>
        </button>


        <button
            onclick="navigate('store',this)"
        >
            <span class="nav-icon">S</span>
            <span class="nav-text">Apollo Store</span>
        </button>


        <div class="nav-label">
            MONITOR
        </div>


        <button
            onclick="navigate('performance',this)"
        >
            <span class="nav-icon">P</span>
            <span class="nav-text">Performance</span>
        </button>


        <button
            onclick="navigate('hardware',this)"
        >
            <span class="nav-icon">H</span>
            <span class="nav-text">Hardware</span>
        </button>


        <div class="nav-label">
            CONFIGURATION
        </div>


        <button
            onclick="navigate('settings',this)"
        >
            <span class="nav-icon">C</span>
            <span class="nav-text">Settings</span>
        </button>

    </nav>

</aside>


<!-- CONTENT -->

<main
    id="content"
    class="content"
></main>

</div>


<!-- DOCK -->

<div class="dock">

    <button onclick="navigate('home')">
        HOME
    </button>

    <button onclick="navigate('library')">
        GAMES
    </button>

    <button onclick="navigate('store')">
        STORE
    </button>

    <button onclick="toggleGamingMode()">
        BOOST
    </button>

    <button onclick="navigate('performance')">
        PERF
    </button>

    <button onclick="navigate('settings')">
        SET
    </button>

</div>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()"
        >
            X
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* ======================================================
   APOLLO STATE
====================================================== */

const content =
    document.getElementById("content");

const TOTAL_GAMES = 50000;

let games = [];

let installed =
    new Set(
        JSON.parse(
            localStorage.getItem(
                "apolloInstalled"
            ) || "[]"
        )
    );

let currentPage = "home";

let currentStorePage = 1;

const GAMES_PER_PAGE = 40;

let searchTerm = "";

let selectedCategory = "All";

let gamingMode = false;

let settings = {
    performanceMode:true,
    fullscreenOptimization:true,
    autoUpdates:true,
    rayTracing:true,
    vSync:false,
    cloudSync:true,
    notifications:true,
    startupApps:false,
    quality:"Ultra",
    resolution:"1920 × 1080",
    refreshRate:"144 Hz",
    volume:75
};


/* ======================================================
   CATEGORIES
====================================================== */

const categories = [
    "Action",
    "Adventure",
    "Arcade",
    "Racing",
    "Strategy",
    "Puzzle",
    "Sports",
    "RPG",
    "Simulation",
    "Platformer",
    "Shooter",
    "Indie"
];


/* ======================================================
   50,000 GAME CATALOG
====================================================== */

/*
    The catalog is generated locally.

    It does NOT claim these are 50,000 real commercial
    games. They are Apollo catalog entries.

    This keeps the single HTML file small and fast.
*/

function generateCatalog(){

    games = new Array(TOTAL_GAMES);

    for(
        let i = 0;
        i < TOTAL_GAMES;
        i++
    ){

        const number = i + 1;

        const category =
            categories[
                i % categories.length
            ];

        games[i] = {

            id:
                "apollo-game-" +
                number,

            title:
                "Apollo " +
                category +
                " " +
                String(number)
                .padStart(5,"0"),

            category,

            price:
                (i % 7 === 0)
                ? 0
                : Number(
                    (
                        4.99 +
                        (i % 20) * 2.5
                    ).toFixed(2)
                ),

            playable:
                i < 12

        };

    }
}


/* ======================================================
   BOOT
====================================================== */

const bootMessages = [
    "Initializing Apollo Core",
    "Loading game catalog",
    "Indexing 50,000 games",
    "Starting game services",
    "Preparing desktop",
    "Apollo is ready"
];

let bootIndex = 0;

const bootStatus =
    document.getElementById(
        "bootStatus"
    );

const bootTimer =
    setInterval(
        () => {

            if(
                bootIndex <
                bootMessages.length
            ){

                bootStatus.textContent =
                    bootMessages[
                        bootIndex++
                    ];

            }

        },
        550
    );


setTimeout(
    () => {

        document.getElementById(

        document.getElementById(

        ).style.display =
            "block";

        loadSettings();

        generateCatalog();

        renderHome();

        updateClock();

    },
    3500
);

        .forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );

    if(button){

        );

    if(page === "home")
        renderHome();

    if(page === "library")
        renderLibrary();

    if(page === "store")
        renderStore();

    if(page === "performance")
        renderPerformance();

    if(page === "hardware")

    if(page === "settings")
        renderSettings();
}

/* ======================================================
   PAGINATION
====================================================== */

function paginationButtons(
    current,
    total
){

    const buttons = [];

    const start =
        Math.max(
            1,
            current - 2
        );

    const end =
        Math.min(
            total,
            current + 2
        );

    for(
        let i = start;
        i <= end;
        i++
    ){

        buttons.push(`

            <button
                class="
                    page-button
                    ${
                        i === current
                        ? "active"
                        : ""
                    }
                "
                onclick="storePage(${i})"
            >
                ${i}
            </button>

        `);

    }

    return buttons.join("");
}


function storePage(
    page
){

    currentStorePage =
        page;

    renderStore();
}

    searchTerm =
        document.getElementById(

function installGame(
    id
){

    const game =
        games.find(
            item =>
            item.id === id
        );

    if(!game)
        return;

    installed.add(
        game.id
    );

    localStorage.setItem(
        "apolloInstalled",
        JSON.stringify(
            [...installed]
        )
    );

    notify(
        game.title +
        " added to your library."
    );

    if(
        currentPage ===
        "store"
    ){

        renderStore();

    }

    if(
        currentPage ===
        "library"
    ){

        renderLibrary();

    }
}


/* ======================================================
   PLAYABLE GAMES
====================================================== */

function launchGame(
    id
){

    const game =
        games.find(
            item =>
            item.id === id
        );

    if(!game)
        return;

    if(!game.playable){

        notify(
            "This catalog entry does not contain a browser game."
        );

        return;

    }

    gamingMode =
        true;

    updateGamingIndicator();

    if(
        game.id ===
        "apollo-game-1"
    ){

        openSnakeGame();

        return;

    }

    if(
        game.id ===
        "apollo-game-2"
    ){

        openClickGame();

        return;

    }

    if(
        game.id ===
        "apollo-game-3"
    ){

        openReactionGame();

        return;

    }

    openGenericGame(
        game
    );
}


/* ======================================================
   GAME 1: SNAKE
====================================================== */

function openSnakeGame(){

    openModal(`

        <h2>
            Apollo Arcade: Snake
        </h2>

        <p class="settings-description">
            Use the arrow keys to control the snake.
        </p>

        <div class="game-screen">

            <canvas
                id="snakeCanvas"
                class="game-canvas"
                width="500"
                height="300"
            ></canvas>

        </div>

    `);

    setTimeout(
        startSnake,
        50
    );
}


function startSnake(){

    const canvas =
        document.getElementById(
            "snakeCanvas"
        );

    if(!canvas)
        return;

    const ctx =
        canvas.getContext("2d");

    const size = 20;

    let snake = [
        {x:10,y:7},
        {x:9,y:7},
        {x:8,y:7}
    ];

    let food = {
        x:15,
        y:7
    };

    let dx = 1;
    let dy = 0;

    let running = true;

    function placeFood(){

        food = {
            x:
                Math.floor(
                    Math.random() *
                    25
                ),

            y:
                Math.floor(
                    Math.random() *
                    15
                )
        };

    }

    function draw(){

        if(!running)
            return;

        ctx.fillStyle =
            "#05080d";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle =
            "#63b2ff";

        snake.forEach(
            part => {

                ctx.fillRect(
                    part.x * size,
                    part.y * size,
                    size - 2,
                    size - 2
                );

            }
        );

        ctx.fillStyle =
            "#ff6574";

        ctx.fillRect(
            food.x * size,
            food.y * size,
            size - 2,
            size - 2
        );

    }

    function update(){

        if(!running)
            return;

        const head = {
            x:
                snake[0].x + dx,

            y:
                snake[0].y + dy
        };

        if(
            head.x < 0 ||
            head.x >= 25 ||
            head.y < 0 ||
            head.y >= 15 ||
            snake.some(
                p =>
                p.x === head.x &&
                p.y === head.y
            )
        ){

            running = false;

            notify(
                "Snake game over."
            );

            return;

        }

        snake.unshift(
            head
        );

        if(
            head.x === food.x &&
            head.y === food.y
        ){

            placeFood();

        }else{

            snake.pop();

        }

        draw();

    }

    function keydown(e){

        if(
            e.key === "ArrowUp" &&
            dy !== 1
        ){

            dx = 0;
            dy = -1;

        }

        if(
            e.key === "ArrowDown" &&
            dy !== -1
        ){

            dx = 0;
            dy = 1;

        }

        if(
            e.key === "ArrowLeft" &&
            dx !== 1
        ){

            dx = -1;
            dy = 0;

        }

        if(
            e.key === "ArrowRight" &&
            dx !== -1
        ){

            dx = 1;
            dy = 0;

        }

    }

    document.addEventListener(
        "keydown",
        keydown
    );

    draw();

    const timer =
        setInterval(
            update,
            110
        );

    const oldClose =
        closeModal;

    window.closeModal =
        function(){

            running = false;

            clearInterval(
                timer
            );

            document.removeEventListener(
                "keydown",
                keydown
            );

            document.getElementById(
                "modal"
            ).style.display =
                "none";

            window.closeModal =
                oldClose;

        };

}

                class="primary"
                style="margin-top:25px"
                onclick="saveSettings()"
            >
                SAVE SETTINGS
            </button>

        `;

    }


    if(
        section ===
        "graphics"
    ){

        target.innerHTML = `

            <h2>
                Graphics
            </h2>

            <p class="settings-description">
                Graphics configuration.
            </p>

            ${toggleSetting(
                "rayTracing",
                "Ray Tracing",
                "Enable ray tracing when supported."
            )}

            ${toggleSetting(
                "vSync",
                "Vertical Synchronization",
                "Synchronize rendering with the display."
            )}

        `;

    }


    if(
        section ===
        "display"
    ){

        target.innerHTML = `

            <h2>
                Display
            </h2>

            <p class="settings-description">
                Display configuration.
            </p>

            ${selectSetting(
                "resolution",
                "Resolution",
                [
                    "1280 × 720",
                    "1920 × 1080",
                    "2560 × 1440",
                    "3840 × 2160"
                ]
            )}

            ${selectSetting(
                "refreshRate",
                "Refresh Rate",
                [
                    "60 Hz",
                    "75 Hz",
                    "120 Hz",
                    "144 Hz",
                    "165 Hz",
                    "240 Hz"
                ]
            )}

        `;

    }


    if(
        section ===
        "audio"
    ){

        target.innerHTML = `

            <h2>
                Audio
            </h2>

            <p class="settings-description">
                System audio preferences.
            </p>

            <div class="setting-row">

                <div>

                    <div class="setting-title">
                        Master Volume
                    </div>

                    <div class="setting-help">
                        ${settings.volume}%
                    </div>

                </div>

                <input
                    class="range"
                    type="range"
                    min="0"
                    max="100"
                    value="${settings.volume}"
                    oninput="
                        settings.volume =
                        Number(this.value);
                        renderSettingsSection('audio');
                    "
                >

            </div>

        `;

    }


    if(
        section ===
        "system"
    ){

        target.innerHTML = `

            <h2>
                System
            </h2>

            <p class="settings-description">
                General Apollo behavior.
            </p>

            ${toggleSetting(
                "notifications",
                "Notifications",
                "Show system notifications."
            )}

            ${toggleSetting(
                "startupApps",
                "Startup Applications",
                "Allow apps to start with Apollo."
            )}

            <button
                class="primary"
                style="margin-top:25px"
                onclick="saveSettings()"
            >
                SAVE SETTINGS
            </button>

        `;

    }

}


function toggleSetting(
    key,
    title,
    help
){

    return `

        <div class="setting-row">

            <div>

                <div class="setting-title">
                    ${title}
                </div>

                <div class="setting-help">
                    ${help}
                </div>

            </div>

            <div
                class="
                    toggle
                    ${
                        settings[key]
                        ? "on"
                        : ""
                    }
                "
                onclick="
                    settings['${key}'] =
                    !settings['${key}'];
                    renderSettingsSection(
                        '${settingsSection}'
                    );
                "
            ></div>

        </div>

    `;
}


function selectSetting(
    key,
    title,
    options
){

    return `

        <div class="setting-row">

            <div>

                <div class="setting-title">
                    ${title}
                </div>

                <div class="setting-help">
                    Select a value.
                </div>

            </div>

            <select
                class="setting-select"
                onchange="
                    settings['${key}'] =
                    this.value;
                    saveSettings();
                "
            >

                ${
                    options
                    .map(
                        option => `

                            <option
                                ${
                                    settings[key] ===
                                    option
                                    ? "selected"
                                    : ""
                                }
                            >
                                ${option}
                            </option>

                        `
                    )
                    .join("")
                }

            </select>

        </div>

    `;
}


/* ======================================================
   GAMING MODE
====================================================== */

function toggleGamingMode(){

    gamingMode =
        !gamingMode;

    updateGamingIndicator();

    notify(
        gamingMode
        ? "Gaming Mode enabled."
        : "Gaming Mode disabled."
    );

    if(
        currentPage ===
        "performance"
    ){

        renderPerformance();

    }

    if(
        currentPage ===
        "home"
    ){

        renderHome();

    }
}


function updateGamingIndicator(){

    const element =
        document.getElementById(
            "gamingIndicator"
        );

    element.textContent =
        gamingMode
        ? "Gaming Mode"
        : "Balanced";

    element.style.color =
        gamingMode
        ? "var(--green)"
        : "";
}


/* ======================================================
   MODAL
====================================================== */

function openModal(
    html
){

    document.getElementById(
        "modalContent"
    ).innerHTML =
        html;

    document.getElementById(
        "modal"
    ).style.display =
        "flex";
}


function closeModal(){

    document.getElementById(
        "modal"
    ).style.display =
        "none";
}


document
    .getElementById(
        "modal"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeModal();

            }

        }
    );


/* ======================================================
   TOAST
====================================================== */

function notify(
    message
){

    if(
        settings.notifications ===
        false
    )
        return;

    const toast =
        document.createElement(
            "div"
        );

    toast.className =
        "toast";

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );

    setTimeout(
        () => toast.remove(),
        2200
    );
}


/* ======================================================
   HTML SAFETY
====================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}
