<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APOLLO GAME OS</title>

<style>
:root {
    --bg: #07090d;
    --bg2: #0d1118;
    --panel: rgba(18, 23, 31, 0.88);
    --panel2: #151b24;
    --panel3: #202733;
    --border: rgba(255,255,255,.08);

    --text: #f4f6fa;
    --muted: #8993a3;

    --blue: #68b5ff;
    --blue2: #397fe5;
    --purple: #8b73ff;

    --green: #55d49a;
    --red: #ff6675;

    --shadow: 0 25px 70px rgba(0,0,0,.45);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(67,130,220,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(116,74,190,.12),
            transparent 30%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================================================
   BOOT SCREEN
========================================================= */

#boot {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #040609;
}

.boot-container {
    width: 390px;
    text-align: center;
}

.boot-logo {
    width: 92px;
    height: 92px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #78baff;
    border-radius: 50%;

    color: #9acaff;

    font-size: 34px;
    font-weight: 800;

    box-shadow:
        0 0 35px rgba(77,160,255,.35),
        inset 0 0 30px rgba(77,160,255,.08);
}

.boot-title {
    margin-top: 24px;

    font-size: 38px;
    font-weight: 700;

    letter-spacing: 8px;
}

.boot-subtitle {
    margin-top: 8px;

    color: #657083;

    font-size: 10px;
    letter-spacing: 4px;
}

.boot-track {
    height: 4px;

    margin-top: 45px;

    overflow: hidden;

    background: #202630;

    border-radius: 20px;
}

.boot-progress {
    width: 0;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            var(--blue2),
            var(--purple)
        );

    animation: bootProgress 3.5s forwards;
}

@keyframes bootProgress {
    to {
        width: 100%;
    }
}

.boot-status {
    margin-top: 14px;

    color: #687383;

    font-size: 11px;
}


/* =========================================================
   APP
========================================================= */

#app {
    display: none;

    width: 100%;
    height: 100%;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 46px;

    position: relative;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: rgba(7,10,15,.76);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(30px);

    user-select: none;
}

.window-controls {
    display: flex;
    gap: 8px;

    margin-right: 20px;
}

.window-control {
    width: 11px;
    height: 11px;

    background: #353c47;

    border-radius: 50%;
}

.brand {
    font-size: 13px;
    font-weight: 700;

    letter-spacing: 1px;
}

.top-center {
    position: absolute;
    left: 50%;

    transform: translateX(-50%);

    color: #8993a3;

    font-size: 12px;
}

.top-right {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 18px;

    color: #aab3c0;

    font-size: 12px;
}

#gamingIndicator {
    transition: .2s;
}


/* =========================================================
   MAIN
========================================================= */

.main {
    display: flex;

    width: 100%;
    height: calc(100% - 46px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 235px;

    flex-shrink: 0;

    padding: 28px 13px;

    background:
        linear-gradient(
            180deg,
            rgba(14,18,25,.96),
            rgba(8,11,16,.96)
        );

    border-right: 1px solid var(--border);
}

.logo-area {
    padding: 0 13px 25px;
}

.logo-name {
    font-size: 22px;
    font-weight: 800;

    letter-spacing: 2px;
}

.logo-caption {
    margin-top: 5px;

    color: #667183;

    font-size: 9px;

    letter-spacing: 2px;
}

.nav-label {
    margin: 16px 13px 8px;

    color: #566171;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 1.7px;
}

.nav button {
    width: 100%;

    display: flex;
    align-items: center;

    padding: 11px 13px;
    margin-bottom: 4px;

    color: #98a2b2;

    background: transparent;

    border: 1px solid transparent;
    border-radius: 9px;

    cursor: pointer;

    text-align: left;

    font-size: 12px;

    transition: .18s;
}

.nav button:hover {
    color: white;

    background: rgba(255,255,255,.045);
}

.nav button.active {
    color: white;

    background:
        linear-gradient(
            90deg,
            rgba(76,143,230,.19),
            rgba(76,143,230,.04)
        );

    border-color: rgba(102,171,255,.14);
}

.nav-icon {
    width: 27px;

    color: #738094;

    font-size: 10px;
    font-weight: 700;
}

.nav button.active .nav-icon {
    color: var(--blue);
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    flex: 1;

    overflow-y: auto;

    padding: 38px 45px 110px;
}

.content::-webkit-scrollbar {
    width: 8px;
}

.content::-webkit-scrollbar-thumb {
    background: #272e39;

    border-radius: 10px;
}

.page-header {
    margin-bottom: 28px;
}

.page-header h1 {
    margin: 0;

    font-size: 30px;
    font-weight: 700;

    letter-spacing: -.8px;
}

.page-header p {
    margin: 7px 0 0;

    color: var(--muted);

    font-size: 13px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    min-height: 245px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    overflow: hidden;

    padding: 38px;

    background:
        radial-gradient(
            circle at 85% 35%,
            rgba(95,164,255,.20),
            transparent 30%
        ),
        linear-gradient(
            120deg,
            #161e2b,
            #0f141d
        );

    border: 1px solid var(--border);

    border-radius: 20px;

    box-shadow: var(--shadow);
}

.hero::after {
    content: "APOLLO";

    position: absolute;

    right: -45px;
    bottom: -50px;

    color: rgba(255,255,255,.025);

    font-size: 150px;
    font-weight: 900;

    letter-spacing: -8px;

    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 1;
}

.hero-tag {
    color: var(--blue);

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 2px;
}

.hero h2 {
    max-width: 650px;

    margin: 9px 0 8px;

    font-size: 38px;

    letter-spacing: -1.5px;
}

.hero p {
    max-width: 550px;

    color: var(--muted);

    line-height: 1.6;
}

.primary {
    position: relative;
    z-index: 2;

    padding: 12px 19px;

    color: white;

    background:
        linear-gradient(
            135deg,
            var(--blue2),
            var(--purple)
        );

    border: 0;
    border-radius: 9px;

    cursor: pointer;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: .5px;

    box-shadow:
        0 8px 25px rgba(64,132,226,.22);

    transition: .2s;
}

.primary:hover {
    transform: translateY(-2px);

    filter: brightness(1.08);
}


/* =========================================================
   CARDS
========================================================= */

.stat-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 13px;

    margin-top: 18px;
}

.card {
    padding: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(26,32,43,.92),
            rgba(18,23,31,.92)
        );

    border: 1px solid var(--border);

    border-radius: 14px;
}

.card-label {
    color: #788394;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 1.4px;
}

.card-value {
    margin-top: 9px;

    font-size: 22px;
    font-weight: 700;
}

.card-sub {
    margin-top: 5px;

    color: #667183;

    font-size: 10px;
}


/* =========================================================
   GAME GRID
========================================================= */

.game-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;
}

.game {
    position: relative;

    min-height: 190px;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    overflow: hidden;

    padding: 20px;

    background:
        radial-gradient(
            circle at 80% 15%,
            rgba(89,160,255,.12),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #1b2535,
            #11161f
        );

    border: 1px solid var(--border);

    border-radius: 15px;

    transition: .2s;
}

.game:hover {
    transform: translateY(-3px);

    border-color:
        rgba(103,175,255,.24);

    box-shadow:
        0 18px 40px rgba(0,0,0,.38);
}

.game-category {
    color: #7891ae;

    font-size: 10px;
}

.game h3 {
    margin: 7px 0 3px;

    font-size: 16px;
}

.game-meta {
    color: #6e7888;

    font-size: 10px;
}

.game-actions {
    display: flex;

    gap: 7px;

    margin-top: 12px;
}

.play {
    padding: 8px 15px;

    color: #0c1017;

    background: #f0f3f7;

    border: 0;

    border-radius: 7px;

    cursor: pointer;

    font-size: 10px;
    font-weight: 800;
}

.secondary {
    padding: 8px 12px;

    color: #dbe1e9;

    background: #252d3a;

    border: 1px solid var(--border);

    border-radius: 7px;

    cursor: pointer;

    font-size: 10px;
}


/* =========================================================
   STORE
========================================================= */

.store-tools {
    display: flex;

    gap: 9px;

    margin-bottom: 18px;
}

.search {
    flex: 1;

    padding: 12px 14px;

    color: white;

    background: #10151d;

    border: 1px solid var(--border);

    border-radius: 9px;

    outline: none;
}

.search:focus {
    border-color:
        rgba(103,177,255,.4);
}

.select,
.setting-select {
    padding: 10px 12px;

    color: #dbe1e8;

    background: #10151d;

    border: 1px solid var(--border);

    border-radius: 8px;

    outline: none;
}

.store-info {
    margin-bottom: 15px;

    color: #788393;

    font-size: 11px;
}


/* =========================================================
   SETTINGS
========================================================= */

.settings-layout {
    display: grid;

    grid-template-columns: 210px 1fr;

    min-height: 550px;

    overflow: hidden;

    background: rgba(16,21,29,.75);

    border: 1px solid var(--border);

    border-radius: 16px;
}

.settings-menu {
    padding: 13px;

    background: rgba(10,14,20,.55);

    border-right: 1px solid var(--border);
}

.settings-menu button {
    width: 100%;

    padding: 11px 12px;

    margin-bottom: 3px;

    color: #8f99a9;

    background: transparent;

    border: 0;

    border-radius: 8px;

    cursor: pointer;

    text-align: left;

    font-size: 11px;
}

.settings-menu button:hover {
    color: white;

    background: rgba(255,255,255,.04);
}

.settings-menu button.active {
    color: white;

    background: #202a38;
}

.settings-content {
    padding: 28px;
}

.settings-content h2 {
    margin: 0;

    font-size: 21px;
}

.settings-description {
    margin: 7px 0 25px;

    color: #788393;

    font-size: 11px;
}

.setting-row {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 17px 0;

    border-bottom: 1px solid var(--border);
}

.setting-title {
    font-size: 12px;
}

.setting-help {
    margin-top: 4px;

    color: #697384;

    font-size: 10px;
}

.toggle {
    position: relative;

    width: 42px;
    height: 23px;

    flex-shrink: 0;

    background: #303845;

    border-radius: 20px;

    cursor: pointer;

    transition: .2s;
}

.toggle::after {
    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    left: 3px;
    top: 3px;

    background: #dce1e8;

    border-radius: 50%;

    transition: .2s;
}

.toggle.on {
    background: var(--blue2);
}

.toggle.on::after {
    left: 22px;
}

.range {
    width: 180px;
}

.settings-buttons {
    display: flex;

    gap: 8px;

    margin-top: 25px;
}


/* =========================================================
   PERFORMANCE
========================================================= */

.performance-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 13px;
}

.performance-value {
    margin-top: 9px;

    font-size: 28px;
    font-weight: 700;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 9000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.68);

    backdrop-filter: blur(7px);
}

.modal-box {
    width: min(620px, 90vw);

    padding: 28px;

    background: #141a23;

    border: 1px solid var(--border);

    border-radius: 16px;

    box-shadow:
        0 35px 100px rgba(0,0,0,.7);
}

.close {
    float: right;

    width: 28px;
    height: 28px;

    color: #aab3c0;

    background: #252c37;

    border: 0;

    border-radius: 7px;

    cursor: pointer;
}


/* =========================================================
   DOCK
========================================================= */

.dock {
    position: fixed;

    left: 50%;
    bottom: 16px;

    z-index: 3000;

    display: flex;

    gap: 5px;

    padding: 7px;

    transform: translateX(-50%);

    background: rgba(17,21,29,.88);

    border: 1px solid var(--border);

    border-radius: 14px;

    backdrop-filter: blur(25px);

    box-shadow: var(--shadow);
}

.dock button {
    width: 48px;
    height: 39px;

    color: #9ba5b5;

    background: transparent;

    border: 0;

    border-radius: 9px;

    cursor: pointer;

    font-size: 9px;
    font-weight: 700;

    transition: .18s;
}

.dock button:hover {
    color: white;

    background: #252e3b;
}


/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    top: 65px;
    right: 22px;

    z-index: 10000;

    padding: 12px 17px;

    color: #e9edf2;

    background: #1b222d;

    border: 1px solid var(--border);

    border-radius: 9px;

    box-shadow: var(--shadow);

    font-size: 11px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 1000px) {

    .stat-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .game-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media(max-width: 700px) {

    .sidebar {
        width: 65px;
    }

    .logo-area,
    .nav-label {
        display: none;
    }

    .nav button {
        justify-content: center;
    }

    .nav-icon {
        width: auto;
    }

    .nav-text {
        display: none;
    }

    .content {
        padding: 25px 20px 100px;
    }

    .game-grid {
        grid-template-columns: 1fr;
    }

    .stat-grid {
        grid-template-columns: 1fr;
    }

    .hero {
        align-items: flex-start;

        flex-direction: column;
    }

    .settings-layout {
        grid-template-columns: 1fr;
    }

    .settings-menu {
        display: flex;

        overflow-x: auto;

        border-right: 0;
        border-bottom: 1px solid var(--border);
    }

    .settings-menu button {
        min-width: 125px;
    }

    .top-center {
        display: none;
    }
}
</style>
</head>

<body>


<!-- =========================================================
     BOOT
========================================================= -->

<div id="boot">

    <div class="boot-container">

        <div class="boot-logo">
            A
        </div>

        <div class="boot-title">
            APOLLO
        </div>

        <div class="boot-subtitle">
            GAME OPERATING SYSTEM
        </div>

        <div class="boot-track">
            <div class="boot-progress"></div>
        </div>

        <div
            id="bootStatus"
            class="boot-status"
        >
            Initializing Apollo Core
        </div>

    </div>

</div>


<!-- =========================================================
     APPLICATION
========================================================= -->

<div id="app">


    <!-- TOP BAR -->

    <header class="topbar">

        <div class="window-controls">

            <span class="window-control"></span>
            <span class="window-control"></span>
            <span class="window-control"></span>

        </div>

        <div class="brand">
            APOLLO
        </div>

        <div class="top-center">
            Game Operating System
        </div>

        <div class="top-right">

            <span id="gamingIndicator">
                Balanced
            </span>

            <span id="clock">
                --:--
            </span>

        </div>

    </header>


    <div class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo-area">

                <div class="logo-name">
                    APOLLO
                </div>

                <div class="logo-caption">
                    GAMING COMMAND CENTER
                </div>

            </div>


            <div class="nav-label">
                SYSTEM
            </div>


            <nav class="nav">

                <button
                    class="active"
                    onclick="navigate('home', this)"
                >
                    <span class="nav-icon">H</span>
                    <span class="nav-text">Home</span>
                </button>


                <button
                    onclick="navigate('library', this)"
                >
                    <span class="nav-icon">G</span>
                    <span class="nav-text">
                        Game Library
                    </span>
                </button>


                <button
                    onclick="navigate('store', this)"
                >
                    <span class="nav-icon">S</span>
                    <span class="nav-text">
                        Apollo Store
                    </span>
                </button>


                <div class="nav-label">
                    MONITOR
                </div>


                <button
                    onclick="navigate('performance', this)"
                >
                    <span class="nav-icon">P</span>
                    <span class="nav-text">
                        Performance
                    </span>
                </button>


                <button
                    onclick="navigate('hardware', this)"
                >
                    <span class="nav-icon">H</span>
                    <span class="nav-text">
                        Hardware
                    </span>
                </button>


                <div class="nav-label">
                    CONFIGURATION
                </div>


                <button
                    onclick="navigate('settings', this)"
                >
                    <span class="nav-icon">C</span>
                    <span class="nav-text">
                        Settings
                    </span>
                </button>

            </nav>

        </aside>


        <!-- CONTENT -->

        <main
            id="content"
            class="content"
        ></main>


    </div>


    <!-- DOCK -->

    <div class="dock">

        <button onclick="navigate('home')">
            HOME
        </button>

        <button onclick="navigate('library')">
            GAMES
        </button>

        <button onclick="navigate('store')">
            STORE
        </button>

        <button onclick="toggleGamingMode()">
            BOOST
        </button>

        <button onclick="navigate('performance')">
            PERF
        </button>

        <button onclick="navigate('settings')">
            SET
        </button>

    </div>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()"
        >
            X
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =========================================================
   APOLLO STATE
========================================================= */

const content =
    document.getElementById("content");

let games = [];

let installed =
    new Set();

let gamingMode = false;

let currentPage = "home";

let settingsSection =
    "performance";

let settings = {

    performanceMode: true,

    rayTracing: true,

    vSync: false,

    autoUpdates: true,

    cloudSync: true,

    notifications: true,

    startupApps: false,

    fullscreenOptimization: true,

    resolution: "1920 × 1080",

    refreshRate: "144 Hz",

    quality: "Ultra",

    volume: 75

};


/* =========================================================
   SETTINGS STORAGE
========================================================= */

function loadSettings() {

    const saved =
        localStorage.getItem(
            "apolloSettings"
        );

    if (!saved)
        return;

    try {

        settings = {
            ...settings,
            ...JSON.parse(saved)
        };

    } catch(error) {

        console.warn(
            "Could not load Apollo settings."
        );

    }
}


function saveSettings() {

    localStorage.setItem(
        "apolloSettings",
        JSON.stringify(settings)
    );

    notify("Settings saved.");
}


function resetSettings() {

    localStorage.removeItem(
        "apolloSettings"
    );

    location.reload();
}


/* =========================================================
   LIBRARY STORAGE
========================================================= */

function loadInstalledGames() {

    const saved =
        localStorage.getItem(
            "apolloInstalledGames"
        );

    if (!saved)
        return;

    try {

        installed =
            new Set(
                JSON.parse(saved)
            );

    } catch(error) {

        installed =
            new Set();

    }
}


function saveInstalledGames() {

    localStorage.setItem(
        "apolloInstalledGames",
        JSON.stringify(
            [...installed]
        )
    );
}


/* =========================================================
   REAL GAME DATA
========================================================= */

/*
    IMPORTANT:

    There is deliberately NO fake game generator.

    To connect a real Apollo Store backend later,
    replace this function with your API request.

    Example:

        const response =
            await fetch("/api/games");

        games = await response.json();

    Expected format:

        [
            {
                "id": "game-123",
                "title": "Real Game",
                "genre": "Action",
                "price": 29.99
            }
        ]
*/

async function loadGames() {

    games = [];

    renderStore();
}


/* =========================================================
   BOOT
========================================================= */

const bootMessages = [
    "Initializing Apollo Core",
    "Detecting system hardware",
    "Loading gaming services",
    "Starting desktop services",
    "Preparing user environment",
    "Apollo is ready"
];

let bootIndex = 0;

const bootStatus =
    document.getElementById(
        "bootStatus"
    );

const bootTimer =
    setInterval(() => {

        if (
            bootIndex <
            bootMessages.length
        ) {

            bootStatus.textContent =
                bootMessages[
                    bootIndex
                ];

            bootIndex++;

        }

    }, 560);


setTimeout(async () => {

    clearInterval(
        bootTimer
    );

    document.getElementById(
        "boot"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";

    loadSettings();

    loadInstalledGames();

    await loadGames();

    navigate("home");

    updateClock();

}, 3500);


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    document.getElementById(
        "clock"
    ).textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    setTimeout(
        updateClock,
        1000
    );
}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(
    page,
    button
) {

    currentPage =
        page;

    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            item =>
            item.classList.remove(
                "active"
            )
        );

    if (button) {

        button.classList.add(
            "active"
        );

    }

    switch(page) {

        case "home":
            renderHome();
            break;

        case "library":
            renderLibrary();
            break;

        case "store":
            renderStore();
            break;

        case "performance":
            renderPerformance();
            break;

        case "hardware":
            renderHardware();
            break;

        case "settings":
            renderSettings();
            break;

    }
}

/* =========================================================
   STORE
========================================================= */

function renderStore(
    search = "",
    genre = "All"
) {

    let result =
        [...games];

    if (search) {

        const query =
            search.toLowerCase();

        result =
            result.filter(
                game =>
                String(
                    game.title
                )
                .toLowerCase()
                .includes(query)
            );

    }

    if (genre !== "All") {

        result =
            result.filter(
                game =>
                game.genre === genre
            );

    }


    const genres =
        [
            ...new Set(
                games
                .map(
                    game =>
                    game.genre
                )
                .filter(Boolean)
            )
        ];


    content.innerHTML = `

        <div class="page-header">

            <h1>
                Apollo Store
            </h1>

            <p>
                Real game catalog connected to Apollo.
            </p>

        </div>


        <div class="store-tools">

            <input
                id="storeSearch"
                class="search"
                placeholder="Search games"
                value="${escapeAttribute(
                    search
                )}"
                oninput="searchStore()"
            >


            <select
                id="storeGenre"
                class="select"
                onchange="filterStore()"
            >

                <option>
                    All
                </option>

                ${
                    genres
                    .map(
                        item =>
                        `
                        <option
                            value="${escapeAttribute(
                                item
                            )}"
                            ${
                                genre === item
                                ? "selected"
                                : ""
                            }
                        >
                            ${escapeHTML(
                                item
                            )}
                        </option>
                        `
                    )
                    .join("")
                }

            </select>

        </div>


        ${
            games.length === 0

            ? emptyState(
                "Apollo Store is not connected",
                "No game catalog has been supplied. Connect a real game-store API to populate this page."
            )

            : `

                <div class="store-info">

                    ${result.length}
                    game${
                        result.length === 1
                        ? ""
                        : "s"
                    }

                    found

                </div>


                ${
                    result.length === 0

                    ? emptyState(
                        "No games found",
                        "Try another search."
                    )

                    : `
                        <div class="game-grid">

                            ${
                                result
                                .map(
                                    gameCard
                                )
                                .join("")
                            }

                        </div>
                    `
                }

            `
        }

    `;
}


function searchStore() {

    clearTimeout(
        window.searchTimer
    );

    window.searchTimer =
        setTimeout(
            () => {

                const search =
                    document.getElementById(
                        "storeSearch"
                    ).value;

                const genre =
                    document.getElementById(
                        "storeGenre"
                    ).value;

                renderStore(
                    search,
                    genre
                );

            },
            150
        );
}


function filterStore() {

    const search =
        document.getElementById(
            "storeSearch"
        ).value;

    const genre =
        document.getElementById(
            "storeGenre"
        ).value;

    renderStore(
        search,
        genre
    );
}


/* =========================================================
   INSTALL / LAUNCH
========================================================= */

function installGame(
    id
) {

    const game =
        games.find(
            item =>
            String(item.id) ===
            String(id)
        );

    if (!game)
        return;

    installed.add(
        game.id
    );

    saveInstalledGames();

    notify(
        game.title +
        " installed."
    );

    if (
        currentPage ===
        "store"
    ) {

        renderStore();

    }

    if (
        currentPage ===
        "library"
    ) {

        renderLibrary();

    }
}


function launchGame(
    id
) {

    const game =
        games.find(
            item =>
            String(item.id) ===
            String(id)
        );

    if (!game)
        return;

    if (
        !installed.has(
            game.id
        )
    ) {

        installGame(
            game.id
        );

        return;

    }


    gamingMode =
        true;

    updateGamingIndicator();

    openModal(`

        <h2>
            ${escapeHTML(
                game.title
            )}
        </h2>

        <p class="settings-description">
            Apollo is ready to launch this game.
        </p>

        <p class="settings-description">
            A native game-launcher service must be
            connected for the browser interface to
            launch the actual executable.
        </p>

    `);
}

/* =========================================================
   SETTINGS COMPONENTS
========================================================= */

function toggleSetting(
    key,
    title,
    help
) {

    return `

        <div class="setting-row">

            <div>

                <div class="setting-title">
                    ${escapeHTML(title)}
                </div>

                <div class="setting-help">
                    ${escapeHTML(help)}
                </div>

            </div>


            <div
                class="
                    toggle
                    ${
                        settings[key]
                        ? "on"
                        : ""
                    }
                "
                onclick="
                    changeToggle(
                        '${key}'
                    )
                "
            ></div>

        </div>

    `;
}


function selectSetting(
    key,
    title,
    options
) {

    return `

        <div class="setting-row">

            <div>

                <div class="setting-title">
                    ${escapeHTML(title)}
                </div>

                <div class="setting-help">
                    Select your preferred value.
                </div>

            </div>


            <select
                class="setting-select"
                onchange="
                    changeSelect(
                        '${key}',
                        this.value
                    )
                "
            >

                ${
                    options
                    .map(
                        option =>
                        `
                        <option
                            value="${escapeAttribute(
                                option
                            )}"
                            ${
                                settings[key] ===
                                option
                                ? "selected"
                                : ""
                            }
                        >
                            ${escapeHTML(
                                option
                            )}
                        </option>
                        `
                    )
                    .join("")
                }

            </select>

        </div>

    `;
}


function rangeSetting(
    key,
    title,
    help
) {

    return `

        <div class="setting-row">

            <div>

                <div class="setting-title">
                    ${escapeHTML(title)}
                </div>

                <div class="setting-help">
                    ${escapeHTML(help)}
                </div>

            </div>


            <input
                class="range"
                type="range"
                min="0"
                max="100"
                value="${settings[key]}"
                oninput="
                    changeRange(
                        '${key}',
                        this.value
                    )
                "
            >

        </div>

    `;
}


/* =========================================================
   SETTINGS ACTIONS
========================================================= */

function changeToggle(
    key
) {

    settings[key] =
        !settings[key];

    renderSettingsSection(
        settingsSection
    );
}


function changeSelect(
    key,
    value
) {

    settings[key] =
        value;
}


function changeRange(
    key,
    value
) {

    settings[key] =
        Number(value);
}


/* =========================================================
   GAMING MODE
========================================================= */

function toggleGamingMode() {

    gamingMode =
        !gamingMode;

    updateGamingIndicator();

    notify(
        gamingMode
        ? "Gaming Mode enabled."
        : "Gaming Mode disabled."
    );

    if (
        currentPage ===
        "performance"
    ) {

        renderPerformance();

    }

    if (
        currentPage ===
        "home"
    ) {

        renderHome();

    }
}


function updateGamingIndicator() {

    const indicator =
        document.getElementById(
            "gamingIndicator"
        );

    indicator.textContent =
        gamingMode
        ? "Gaming Mode"
        : "Balanced";

    indicator.style.color =
        gamingMode
        ? "var(--green)"
        : "";
}


/* =========================================================
   MODAL
========================================================= */

function openModal(
    html
) {

    document.getElementById(
        "modalContent"
    ).innerHTML =
        html;

    document.getElementById(
        "modal"
    ).style.display =
        "flex";
}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";
}


document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeModal();

            }

        }
    );


/* =========================================================
   NOTIFICATIONS
========================================================= */

function notify(
    message
) {

    if (
        settings.notifications ===
        false
    ) {

        return;

    }


    const toast =
        document.createElement(
            "div"
        );

    toast.className =
        "toast";

    toast.textContent =
        message;

    document.body.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        2200
    );
}


/* =========================================================
   SECURITY / HTML HELPERS
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );
}
