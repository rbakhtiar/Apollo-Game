<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APOLLO GAME OS</title>

<style>
:root {
    --bg: #080b12;
    --panel: rgba(18, 23, 34, .88);
    --card: #171e2c;
    --card2: #20293a;
    --text: #f4f7fb;
    --muted: #929daf;
    --blue: #62b5ff;
    --purple: #967cff;
    --green: #55e6a5;
    --red: #ff667a;
    --border: rgba(255,255,255,.09);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 75% 15%, #1b3154 0%, transparent 32%),
        radial-gradient(circle at 20% 80%, #241842 0%, transparent 30%),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* BOOT SCREEN */

#bootScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #03050a;
}

.boot {
    text-align: center;
}

.apollo-symbol {
    font-size: 100px;
    color: var(--blue);
    text-shadow:
        0 0 20px #62b5ff,
        0 0 80px #62b5ff55;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
        filter: brightness(1.5);
    }
}

.boot h1 {
    margin: 10px 0 0;
    font-size: 48px;
    letter-spacing: 10px;
}

.boot p {
    color: var(--muted);
    letter-spacing: 5px;
}

.boot-progress {
    width: 340px;
    height: 5px;
    margin: 35px auto 15px;
    overflow: hidden;
    border-radius: 20px;
    background: #1c2431;
}

.boot-progress div {
    height: 100%;
    width: 0;
    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple)
    );
    animation: bootLoad 3s forwards;
}

@keyframes bootLoad {
    to {
        width: 100%;
    }
}

#bootStatus {
    color: #758093;
    font-size: 12px;
}

/* DESKTOP */

#desktop {
    display: none;
    height: 100vh;
}

/* TOP BAR */

.topbar {
    height: 42px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 22px;

    background: rgba(7,10,16,.75);
    backdrop-filter: blur(25px);

    border-bottom: 1px solid var(--border);
}

.brand {
    font-weight: 800;
    letter-spacing: 1px;
}

.menu {
    color: var(--muted);
    font-size: 13px;
}

.top-right {
    margin-left: auto;
    display: flex;
    gap: 18px;
    color: var(--muted);
    font-size: 13px;
}

/* MAIN */

.layout {
    display: flex;
    height: calc(100vh - 42px);
}

/* SIDEBAR */

.sidebar {
    width: 235px;
    padding: 28px 14px;

    background: rgba(10,14,22,.82);
    border-right: 1px solid var(--border);

    backdrop-filter: blur(25px);
}

.sidebar-logo {
    padding: 0 12px;
    font-size: 24px;
    font-weight: 800;
}

.sidebar-sub {
    padding: 3px 12px;
    color: var(--muted);
    font-size: 11px;
}

.nav {
    margin-top: 28px;
}

.nav button {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 5px;

    text-align: left;

    border-radius: 10px;
    border: 0;

    background: transparent;
    color: #aeb8c8;

    cursor: pointer;
    transition: .2s;
}

.nav button:hover,
.nav button.active {
    background: #1d2737;
    color: white;
}

/* CONTENT */

.content {
    flex: 1;
    overflow-y: auto;
    padding: 38px 45px 120px;
}

.content h2 {
    margin: 0;
    font-size: 31px;
}

.subtitle {
    color: var(--muted);
    margin-top: 6px;
}

/* HERO */

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
    padding: 30px;

    border: 1px solid var(--border);
    border-radius: 20px;

    background:
        linear-gradient(
            120deg,
            #182438,
            #111723
        );

    box-shadow: 0 25px 70px #0005;
}

.hero-title {
    font-size: 12px;
    color: var(--blue);
    font-weight: 800;
    letter-spacing: 2px;
}

.hero h2 {
    margin: 8px 0;
    font-size: 32px;
}

.hero p {
    color: var(--muted);
}

.primary {
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;

    background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple)
    );

    color: #07101a;
    font-weight: 800;
    cursor: pointer;
}

/* CARDS */

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.card {
    padding: 20px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
}

.card-title {
    color: var(--muted);
    font-size: 12px;
}

.metric {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 800;
}

/* GAMES */

.games {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 18px;
}

.game {
    position: relative;
    height: 190px;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;

    padding: 20px;

    overflow: hidden;

    border-radius: 16px;
    border: 1px solid var(--border);

    background:
        linear-gradient(
            145deg,
            #253653,
            #111722
        );

    transition: .2s;
}

.game:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px #0007;
}

.game::before {
    content: "◈";
    position: absolute;
    top: 15px;
    right: 20px;

    font-size: 70px;
    color: #62b5ff18;
}

.game h3 {
    margin: 5px 0;
}

.game small {
    color: var(--muted);
}

.play {
    width: max-content;
    margin-top: 10px;

    padding: 8px 15px;

    border: 0;
    border-radius: 8px;

    background: white;
    color: #080b10;

    font-weight: 800;
    cursor: pointer;
}

/* PERFORMANCE */

.performance-card {
    margin-top: 20px;
}

.progress {
    height: 8px;
    overflow: hidden;

    background: #293242;
    border-radius: 20px;
}

.progress div {
    height: 100%;
    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );
}

/* DOCK */

.dock {
    position: fixed;
    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 6px;

    padding: 8px;

    border: 1px solid var(--border);
    border-radius: 18px;

    background: rgba(15,19,28,.88);

    backdrop-filter: blur(20px);

    box-shadow: 0 25px 70px #0009;
}

.dock button {
    width: 48px;
    height: 45px;

    border: 0;
    border-radius: 12px;

    background: transparent;
    color: white;

    font-size: 20px;

    cursor: pointer;
}

.dock button:hover {
    background: #273247;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 1000;

    background: #0009;
}

.modal-box {
    width: min(600px, 90vw);

    padding: 28px;

    border: 1px solid var(--border);
    border-radius: 18px;

    background: #121823;

    box-shadow: 0 30px 100px #000;
}

.close {
    float: right;

    border: 0;
    border-radius: 8px;

    padding: 5px 10px;

    background: #273247;
    color: white;

    cursor: pointer;
}

/* SETTINGS */

.setting {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 10px;
    padding: 18px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: var(--card);
}

.switch {
    width: 48px;
    height: 27px;

    padding: 3px;

    border-radius: 20px;
    background: #30394a;

    cursor: pointer;
}

.switch i {
    display: block;

    width: 21px;
    height: 21px;

    border-radius: 50%;

    background: white;

    transition: .2s;
}

.switch.on {
    background: var(--blue);
}

.switch.on i {
    transform: translateX(21px);
}

/* RESPONSIVE */

@media(max-width:1000px) {
    .grid {
        grid-template-columns: repeat(2,1fr);
    }

    .games {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:700px) {
    .sidebar {
        width: 70px;
    }

    .sidebar-logo,
    .sidebar-sub {
        display: none;
    }

    .nav button {
        font-size: 0;
        text-align: center;
    }

    .nav button:first-letter {
        font-size: 20px;
    }

    .content {
        padding: 25px 20px 100px;
    }

    .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
    }

    .games {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- BOOT -->

<div id="bootScreen">

    <div class="boot">

        <div class="apollo-symbol">◉</div>

        <h1>APOLLO</h1>

        <p>GAME OS</p>

        <div class="boot-progress">
            <div></div>
        </div>

        <div id="bootStatus">
            INITIALIZING APOLLO CORE...
        </div>

    </div>

</div>


<!-- OPERATING SYSTEM -->

<div id="desktop">

    <!-- TOP BAR -->

    <header class="topbar">

        <span class="brand">
            ◉ APOLLO
        </span>

        <span class="menu">
            Game OS
        </span>

        <div class="top-right">

            <span>🎧</span>
            <span>⌁</span>
            <span>▣</span>

            <span id="clock">
                --:--
            </span>

        </div>

    </header>


    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                APOLLO
            </div>

            <div class="sidebar-sub">
                GAMING COMMAND CENTER
            </div>

            <div class="nav">

                <button
                    class="active"
                    onclick="showPage('home',this)">
                    ⌂ &nbsp; Home
                </button>

                <button
                    onclick="showPage('games',this)">
                    🎮 &nbsp; Game Library
                </button>

                <button
                    onclick="showPage('performance',this)">
                    ⚡ &nbsp; Performance
                </button>

                <button
                    onclick="showPage('hardware',this)">
                    ▣ &nbsp; Hardware
                </button>

                <button
                    onclick="showPage('settings',this)">
                    ⚙ &nbsp; Settings
                </button>

            </div>

        </aside>


        <!-- CONTENT -->

        <main
            class="content"
            id="content">
        </main>

    </div>


    <!-- DOCK -->

    <div class="dock">

        <button onclick="showPage('home')">
            ⌂
        </button>

        <button onclick="showPage('games')">
            🎮
        </button>

        <button onclick="toggleGamingMode()">
            ⚡
        </button>

        <button onclick="showPage('performance')">
            📊
        </button>

        <button onclick="showPage('settings')">
            ⚙
        </button>

    </div>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()">
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =========================
   APOLLO CORE
========================= */

let gamingMode = false;

let currentPage = "home";


/* =========================
   BOOT
========================= */

const bootMessages = [
    "INITIALIZING APOLLO CORE...",
    "DETECTING HARDWARE...",
    "LOADING GRAPHICS SUBSYSTEM...",
    "STARTING GAMING RUNTIME...",
    "STARTING APOLLO DESKTOP...",
    "SYSTEM READY."
];

let bootIndex = 0;

const bootStatus =
    document.getElementById("bootStatus");

const bootTimer =
    setInterval(() => {

        if (bootIndex < bootMessages.length) {

            bootStatus.textContent =
                bootMessages[bootIndex];

            bootIndex++;

        } else {

            clearInterval(bootTimer);

            document
                .getElementById("bootScreen")
                .style.display = "none";

            document
                .getElementById("desktop")
                .style.display = "block";

            showPage("home");

            updateClock();

        }

    }, 500);


/* =========================
   CLOCK
========================= */

function updateClock() {

    const now = new Date();

    document.getElementById("clock")
        .textContent =
        now.toLocaleString([], {
            weekday: "short",
            hour: "2-digit",
            minute: "2-digit"
        });

    setTimeout(updateClock, 1000);
}


/* =========================
   PAGE SYSTEM
========================= */

function showPage(page, button) {

    currentPage = page;

    document
        .querySelectorAll(".nav button")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    if(button) {
        button.classList.add("active");
    }

    if(page === "home")
        renderHome();

    if(page === "games")
        renderGames();

    if(page === "performance")
        renderPerformance();

    if(page === "hardware")
        renderHardware();

    if(page === "settings")
        renderSettings();
}


/* =========================
   HOME
========================= */

function renderHome() {

    document.getElementById("content").innerHTML = `

        <div class="hero">

            <div>

                <div class="hero-title">
                    APOLLO GAME OS
                </div>

                <h2>
                    Ready to play.
                </h2>

                <p>
                    Your gaming command center is ready.
                </p>

            </div>

            <button
                class="primary"
                onclick="showPage('games')">

                OPEN GAME LIBRARY

            </button>

        </div>


        <div class="grid">

            <div class="card">

                <div class="card-title">
                    GAMING MODE
                </div>

                <div class="metric">
                    ${gamingMode ? "ON" : "OFF"}
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    GPU
                </div>

                <div class="metric">
                    READY
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    SYSTEM
                </div>

                <div class="metric">
                    OPTIMIZED
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    FPS TARGET
                </div>

                <div class="metric">
                    144
                </div>

            </div>

        </div>


        <h3 style="margin-top:35px">
            Quick Launch
        </h3>

        <div class="games">

            ${gameCard("Cyber Arena","Competitive • 144 FPS")}

            ${gameCard("Nebula Racing","Racing • Ultra")}

            ${gameCard("Starfall","Adventure • High")}

        </div>
    `;
}


/* =========================
   GAMES
========================= */

const games = [

    ["Cyber Arena","Competitive • 144 FPS"],

    ["Nebula Racing","Racing • Ultra"],

    ["Starfall","Adventure • High"],

    ["Void Protocol","Action • High"],

    ["Galaxy Drift","Racing • 120 FPS"],

    ["Apollo Test Game","Native • Optimized"]

];


function gameCard(name, description) {

    return `

        <div class="game">

            <small>
                ${description}
            </small>

            <h3>
                ${name}
            </h3>

            <button
                class="play"
                onclick="launchGame('${name}')">

                PLAY

            </button>

        </div>

    `;
}


function renderGames() {

    document.getElementById("content").innerHTML = `

        <h2>
            Game Library
        </h2>

        <p class="subtitle">
            Your APOLLO gaming collection.
        </p>

        <div class="games">

            ${games
                .map(game =>
                    gameCard(
                        game[0],
                        game[1]
                    )
                )
                .join("")}

        </div>

    `;
}


/* =========================
   GAMING MODE
========================= */

function toggleGamingMode() {

    gamingMode = !gamingMode;

    showPage(currentPage);

    notification(
        "Gaming Mode " +
        (gamingMode
            ? "enabled"
            : "disabled")
    );
}


/* =========================
   PERFORMANCE
========================= */

function randomValue(min,max) {

    return Math.floor(
        Math.random() *
        (max-min+1)
        + min
    );
}


function renderPerformance() {

    const cpu = randomValue(18,42);

    const gpu = randomValue(45,78);

    const ram = randomValue(35,60);


    document.getElementById("content").innerHTML = `

        <h2>
            Performance Center
        </h2>

        <p class="subtitle">
            APOLLO system performance dashboard.
        </p>


        <div class="grid">

            ${performanceCard(
                "CPU",
                cpu
            )}

            ${performanceCard(
                "GPU",
                gpu
            )}

            ${performanceCard(
                "MEMORY",
                ram
            )}

            <div class="card">

                <div class="card-title">
                    FRAME RATE
                </div>

                <div class="metric">
                    144 FPS
                </div>

            </div>

        </div>


        <div class="card performance-card">

            <h3>
                APOLLO Gaming Engine
            </h3>

            <p class="subtitle">

                ${gamingMode
                    ? "Maximum-performance profile active."
                    : "Balanced profile active."}

            </p>

            <button
                class="primary"
                onclick="toggleGamingMode()">

                ${gamingMode
                    ? "DISABLE GAMING MODE"
                    : "ENABLE GAMING MODE"}

            </button>

        </div>

    `;
}


function performanceCard(name,value) {

    return `

        <div class="card">

            <div class="card-title">
                ${name}
            </div>

            <div class="metric">
                ${value}%
            </div>

            <div
                class="progress"
                style="margin-top:12px">

                <div
                    style="width:${value}%">
                </div>

            </div>

        </div>

    `;
}


/* =========================
   HARDWARE
========================= */

function renderHardware() {

    document.getElementById("content").innerHTML = `

        <h2>
            Hardware
        </h2>

        <p class="subtitle">
            APOLLO hardware overview.
        </p>


        <div class="grid">

            <div class="card">

                <div class="card-title">
                    PROCESSOR
                </div>

                <div class="metric">
                    x86-64
                </div>

                <p class="subtitle">
                    High-performance CPU
                </p>

            </div>


            <div class="card">

                <div class="card-title">
                    GRAPHICS
                </div>

                <div class="metric">
                    GPU READY
                </div>

                <p class="subtitle">
                    Graphics subsystem active
                </p>

            </div>


            <div class="card">

                <div class="card-title">
                    MEMORY
                </div>

                <div class="metric">
                    16 GB
                </div>

                <p class="subtitle">
                    System memory
                </p>

            </div>


            <div class="card">

                <div class="card-title">
                    DISPLAY
                </div>

                <div class="metric">
                    144 Hz
                </div>

                <p class="subtitle">
                    Gaming display profile
                </p>

            </div>

        </div>

    `;
}


/* =========================
   SETTINGS
========================= */

function renderSettings() {

    const settings = [

        "Display",

        "Graphics",

        "Audio",

        "Controllers",

        "Network",

        "Updates & Security",

        "Game Compatibility",

        "APOLLO Account"

    ];


    document.getElementById("content").innerHTML = `

        <h2>
            Settings
        </h2>

        <p class="subtitle">
            Configure APOLLO GAME OS.
        </p>


        ${settings.map(
            item => `

            <div class="setting">

                <strong>
                    ${item}
                </strong>

                <span>
                    ›
                </span>

            </div>

        `
        ).join("")}

    `;
}


/* =========================
   GAME LAUNCHER
========================= */

function launchGame(name) {

    const modal =
        document.getElementById("modal");

    const content =
        document.getElementById(
            "modalContent"
        );


    content.innerHTML = `

        <div class="card-title">
            APOLLO GAME RUNTIME
        </div>

        <h2>
            Launching ${name}
        </h2>

        <p class="subtitle">
            Preparing graphics,
            controller and performance
            services...
        </p>

        <div
            class="progress"
            style="margin-top:20px">

            <div
                style="
                    width:100%;
                    animation:
                    launchProgress
                    1.5s linear;
                ">
            </div>

        </div>

        <p
            class="subtitle"
            style="margin-top:15px">

            Gaming Mode:
            ${gamingMode
                ? "ACTIVE"
                : "AVAILABLE"}

        </p>

    `;


    modal.style.display = "flex";


    setTimeout(
        closeModal,
        1700
    );
}


function closeModal() {

    document.getElementById(
        "modal"
    ).style.display = "none";

}


/* =========================
   NOTIFICATION
========================= */

function notification(message) {

    const n =
        document.createElement("div");


    n.textContent = message;


    n.style.position = "fixed";

    n.style.right = "25px";

    n.style.top = "65px";

    n.style.zIndex = "5000";

    n.style.padding = "13px 18px";

    n.style.borderRadius = "10px";

    n.style.background = "#182235";

    n.style.border =
        "1px solid rgba(255,255,255,.1)";

    n.style.boxShadow =
        "0 15px 40px #0008";


    document.body.appendChild(n);


    setTimeout(
        () => n.remove(),
        2000
    );

}


/* =========================
   START
========================= */

</script>

</body>
</html>
