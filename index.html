<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APOLLO GAME OS</title>

<style>
:root{
    --bg:#070a10;
    --panel:rgba(15,20,30,.88);
    --card:#151c29;
    --card2:#202a3b;
    --text:#f5f7fb;
    --muted:#8f9bad;
    --blue:#62b5ff;
    --purple:#987cff;
    --green:#55e6a5;
    --red:#ff667a;
    --border:rgba(255,255,255,.09);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 75% 15%,
            #1b3155 0,
            transparent 32%
        ),
        radial-gradient(
            circle at 20% 80%,
            #261847 0,
            transparent 30%
        ),
        var(--bg);
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =====================================================
   BOOT
===================================================== */

#bootScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#03050a;
}

.boot{
    text-align:center;
}

.apollo-symbol{
    font-size:105px;
    color:var(--blue);

    text-shadow:
        0 0 20px #62b5ff,
        0 0 90px #62b5ff55;

    animation:apolloPulse 2s infinite;
}

@keyframes apolloPulse{
    50%{
        transform:scale(1.08);
        filter:brightness(1.5);
    }
}

.boot h1{
    margin:5px 0;
    font-size:48px;
    letter-spacing:10px;
}

.boot p{
    color:var(--muted);
    letter-spacing:5px;
}

.boot-progress{
    width:340px;
    height:5px;
    margin:35px auto 15px;

    background:#1c2431;
    border-radius:20px;
    overflow:hidden;
}

.boot-progress div{
    height:100%;
    width:0;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );

    animation:bootLoad 3.4s forwards;
}

@keyframes bootLoad{
    to{width:100%}
}

#bootStatus{
    color:#718096;
    font-size:12px;
}

/* =====================================================
   DESKTOP
===================================================== */

#desktop{
    display:none;
    height:100vh;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    height:42px;

    display:flex;
    align-items:center;

    padding:0 18px;
    gap:22px;

    background:rgba(5,8,13,.78);

    backdrop-filter:blur(25px);

    border-bottom:1px solid var(--border);
}

.brand{
    font-weight:800;
    letter-spacing:1px;
}

.top-menu{
    color:var(--muted);
    font-size:13px;
}

.top-right{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:18px;

    color:var(--muted);
    font-size:13px;
}

/* =====================================================
   LAYOUT
===================================================== */

.layout{
    display:flex;
    height:calc(100vh - 42px);
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:235px;

    padding:28px 14px;

    background:rgba(9,13,21,.84);

    border-right:1px solid var(--border);

    backdrop-filter:blur(25px);
}

.sidebar-logo{
    padding:0 12px;

    font-size:24px;
    font-weight:800;
}

.sidebar-sub{
    padding:3px 12px;

    color:var(--muted);
    font-size:10px;
    letter-spacing:.5px;
}

.nav{
    margin-top:28px;
}

.nav button{
    width:100%;

    margin-bottom:5px;
    padding:13px 14px;

    text-align:left;

    color:#aeb8c8;

    background:transparent;

    border:0;
    border-radius:10px;

    transition:.2s;
}

.nav button:hover,
.nav button.active{
    background:#1d2737;
    color:#fff;
}

/* =====================================================
   CONTENT
===================================================== */

.content{
    flex:1;

    overflow-y:auto;

    padding:38px 45px 120px;
}

.content h2{
    margin:0;

    font-size:31px;
}

.subtitle{
    color:var(--muted);
    margin-top:6px;
}

.section-title{
    margin-top:32px;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:30px;
    margin-bottom:22px;

    border:1px solid var(--border);
    border-radius:20px;

    background:
        linear-gradient(
            120deg,
            #182438,
            #101622
        );

    box-shadow:0 25px 70px #0005;
}

.hero-label{
    color:var(--blue);

    font-size:12px;
    font-weight:800;

    letter-spacing:2px;
}

.hero h1{
    margin:8px 0;

    font-size:34px;
}

.hero p{
    color:var(--muted);
}

.primary{
    padding:12px 18px;

    border:0;
    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    color:#07101a;

    font-weight:800;
}

/* =====================================================
   CARDS
===================================================== */

.grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;
}

.card{
    padding:20px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:15px;
}

.card-title{
    color:var(--muted);
    font-size:12px;
}

.metric{
    margin-top:8px;

    font-size:25px;
    font-weight:800;
}

/* =====================================================
   GAMES
===================================================== */

.games{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:15px;

    margin-top:18px;
}

.game{
    position:relative;

    min-height:190px;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;

    padding:20px;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #253653,
            #111722
        );

    transition:.2s;
}

.game:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 35px #0007;
}

.game::before{
    content:"◈";

    position:absolute;

    right:18px;
    top:15px;

    font-size:70px;

    color:#62b5ff18;
}

.game h3{
    margin:5px 0;
}

.game small{
    color:var(--muted);
}

.play{
    width:max-content;

    margin-top:10px;
    padding:8px 15px;

    border:0;
    border-radius:8px;

    background:white;
    color:#080b10;

    font-weight:800;
}

/* =====================================================
   STORE
===================================================== */

.store-toolbar{
    display:flex;
    gap:10px;

    margin:25px 0;
}

.store-search{
    flex:1;

    min-width:200px;

    padding:13px 15px;

    background:#101621;

    color:white;

    border:1px solid var(--border);

    border-radius:10px;

    outline:none;
}

.store-select{
    padding:13px;

    background:#101621;

    color:white;

    border:1px solid var(--border);

    border-radius:10px;
}

.store-count{
    margin-bottom:18px;
}

/* =====================================================
   PROGRESS
===================================================== */

.progress{
    height:8px;

    overflow:hidden;

    background:#293242;

    border-radius:20px;
}

.progress div{
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );
}

/* =====================================================
   SETTINGS
===================================================== */

.setting{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:10px;
    padding:18px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:12px;
}

.setting-arrow{
    color:var(--muted);
}

/* =====================================================
   DOCK
===================================================== */

.dock{
    position:fixed;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:6px;

    padding:8px;

    background:rgba(15,19,28,.88);

    border:1px solid var(--border);
    border-radius:18px;

    backdrop-filter:blur(20px);

    box-shadow:0 25px 70px #0009;
}

.dock button{
    width:48px;
    height:45px;

    border:0;
    border-radius:12px;

    background:transparent;

    color:white;

    font-size:20px;
}

.dock button:hover{
    background:#273247;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:5000;

    background:#0009;
}

.modal-box{
    width:min(650px,90vw);

    padding:28px;

    background:#121823;

    border:1px solid var(--border);

    border-radius:18px;

    box-shadow:0 30px 100px #000;
}

.close{
    float:right;

    padding:5px 10px;

    border:0;
    border-radius:8px;

    background:#273247;

    color:white;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    right:25px;
    top:60px;

    z-index:8000;

    padding:13px 18px;

    background:#182235;

    border:1px solid var(--border);

    border-radius:10px;

    box-shadow:0 15px 40px #0008;

    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{
        transform:translateX(30px);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

    .grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .games{
        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:700px){

    .sidebar{
        width:70px;
    }

    .sidebar-logo,
    .sidebar-sub{
        display:none;
    }

    .nav button{
        font-size:0;
        text-align:center;
    }

    .content{
        padding:25px 20px 100px;
    }

    .hero{
        flex-direction:column;
        align-items:flex-start;
        gap:20px;
    }

    .games{
        grid-template-columns:1fr;
    }

    .store-toolbar{
        flex-direction:column;
    }
}
</style>
</head>


<body>


<!-- =====================================================
     APOLLO BOOT SCREEN
===================================================== -->

<div id="bootScreen">

    <div class="boot">

        <div class="apollo-symbol">
            ◉
        </div>

        <h1>
            APOLLO
        </h1>

        <p>
            GAME OS
        </p>

        <div class="boot-progress">
            <div></div>
        </div>

        <div id="bootStatus">
            INITIALIZING APOLLO CORE...
        </div>

    </div>

</div>


<!-- =====================================================
     DESKTOP
===================================================== -->

<div id="desktop">


<header class="topbar">

    <span class="brand">
        ◉ APOLLO
    </span>

    <span class="top-menu">
        Game OS
    </span>

    <div class="top-right">

        <span>
            🎧
        </span>

        <span>
            ⚡
        </span>

        <span>
            ▣
        </span>

        <span id="clock">
            --:--
        </span>

    </div>

</header>


<div class="layout">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="sidebar-logo">
        APOLLO
    </div>

    <div class="sidebar-sub">
        GAMING COMMAND CENTER
    </div>


    <div class="nav">

        <button
            class="active"
            onclick="showPage('home',this)">
            ⌂ &nbsp; Home
        </button>


        <button
            onclick="showPage('games',this)">
            🎮 &nbsp; Game Library
        </button>


        <button
            onclick="showPage('store',this)">
            🛍️ &nbsp; Apollo Store
        </button>


        <button
            onclick="showPage('performance',this)">
            ⚡ &nbsp; Performance
        </button>


        <button
            onclick="showPage('hardware',this)">
            ▣ &nbsp; Hardware
        </button>


        <button
            onclick="showPage('settings',this)">
            ⚙ &nbsp; Settings
        </button>

    </div>

</aside>


<!-- =====================================================
     CONTENT
===================================================== -->

<main
    class="content"
    id="content">
</main>


</div>


<!-- =====================================================
     DOCK
===================================================== -->

<div class="dock">

    <button onclick="showPage('home')">
        ⌂
    </button>

    <button onclick="showPage('games')">
        🎮
    </button>

    <button onclick="showPage('store')">
        🛍️
    </button>

    <button onclick="toggleGamingMode()">
        ⚡
    </button>

    <button onclick="showPage('performance')">
        📊
    </button>

    <button onclick="showPage('settings')">
        ⚙
    </button>

</div>


</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()">
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>


<script>

/* =====================================================
   APOLLO CORE STATE
===================================================== */

const APOLLO_GAME_COUNT = 50000;

let gamingMode = false;

let currentPage = "home";

let storeGames = [];

let installedGames =
    new Set();

let wishlist =
    new Set();


/* =====================================================
   STORE DATA
===================================================== */

const genres = [

    "Action",
    "Adventure",
    "RPG",
    "Racing",
    "Strategy",
    "Simulation",
    "Sports",
    "Shooter",
    "Indie",
    "Survival",
    "Horror",
    "Puzzle",
    "Platformer",
    "MMO",
    "Sandbox"

];


const prefixes = [

    "Nebula",
    "Galaxy",
    "Titan",
    "Shadow",
    "Quantum",
    "Cyber",
    "Nova",
    "Eclipse",
    "Void",
    "Apollo",
    "Starlight",
    "Velocity",
    "Infinity",
    "Frontier",
    "Overdrive",
    "Phantom",
    "Crimson",
    "Legend",
    "Storm",
    "Empire"

];


const suffixes = [

    "Rising",
    "Origins",
    "Reborn",
    "Zero",
    "Legacy",
    "Frontier",
    "Arena",
    "Protocol",
    "Chronicles",
    "Online",
    "Evolution",
    "Wars",
    "Odyssey",
    "Nexus",
    "Unlimited"

];


/* =====================================================
   GENERATE 50,000 STORE RECORDS
===================================================== */

function generateStore(){

    const batchSize = 5000;

    for(
        let i = 1;
        i <= APOLLO_GAME_COUNT;
        i++
    ){

        const genre =
            genres[
                i % genres.length
            ];

        const title =
            prefixes[
                i % prefixes.length
            ]
            + " "
            +
            suffixes[
                Math.floor(
                    i / prefixes.length
                ) % suffixes.length
            ]
            + " "
            + i;


        const free =
            i % 9 === 0;


        storeGames.push({

            id:i,

            title:title,

            genre:genre,

            rating:
                (
                    3.5 +
                    Math.random()*1.5
                ).toFixed(1),

            players:
                Math.floor(
                    Math.random()*500000
                ) + 100,

            price:
                free
                    ? 0
                    : Number(
                        (
                            4.99 +
                            Math.random()*55
                        ).toFixed(2)
                    ),

            compatibility:
                i % 4 === 0
                    ? "APOLLO Native"
                    : "Windows Compatible"

        });

    }

}


/* =====================================================
   BOOT
===================================================== */

const bootMessages = [

    "INITIALIZING APOLLO CORE...",

    "DETECTING HARDWARE...",

    "LOADING GRAPHICS SUBSYSTEM...",

    "STARTING GAME RUNTIME...",

    "INDEXING GAME STORE...",

    "STARTING APOLLO DESKTOP...",

    "SYSTEM READY."

];


let bootIndex = 0;


const bootStatus =
    document.getElementById(
        "bootStatus"
    );


const bootTimer =
    setInterval(() => {

        if(
            bootIndex <
            bootMessages.length
        ){

            bootStatus.textContent =
                bootMessages[
                    bootIndex
                ];

            bootIndex++;

        }else{

            clearInterval(
                bootTimer
            );


            document
                .getElementById(
                    "bootScreen"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "desktop"
                )
                .style.display =
                "block";


            generateStore();

            renderHome();

            updateClock();

        }

    },450);


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();


    document
        .getElementById("clock")
        .textContent =
        now.toLocaleString(
            [],
            {
                weekday:"short",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    setTimeout(
        updateClock,
        1000
    );

}


/* =====================================================
   PAGE ROUTER
===================================================== */

function showPage(
    page,
    button
){

    currentPage =
        page;


    document
        .querySelectorAll(
            ".nav button"
        )
        .forEach(
            b =>
            b.classList.remove(
                "active"
            )
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(page === "home")
        renderHome();


    if(page === "games")
        renderGames();


    if(page === "store")
        renderStore();


    if(page === "performance")
        renderPerformance();


    if(page === "hardware")
        renderHardware();


    if(page === "settings")
        renderSettings();

}


/* =====================================================
   HOME
===================================================== */

function renderHome(){

    document
        .getElementById(
            "content"
        )
        .innerHTML = `

        <div class="hero">

            <div>

                <div class="hero-label">
                    APOLLO GAME OS
                </div>

                <h1>
                    Ready to play.
                </h1>

                <p>
                    Your gaming command center
                    is ready.
                </p>

            </div>


            <button
                class="primary"
                onclick="
                    showPage('store')
                "
            >
                OPEN APOLLO STORE
            </button>

        </div>


        <div class="grid">

            ${statCard(
                "GAMING MODE",
                gamingMode
                    ? "ON"
                    : "OFF"
            )}

            ${statCard(
                "STORE",
                "50,000"
            )}

            ${statCard(
                "GPU",
                "READY"
            )}

            ${statCard(
                "FPS TARGET",
                "144"
            )}

        </div>


        <h3 class="section-title">
            Quick Launch
        </h3>


        <div class="games">

            ${gameCard(
                "Cyber Arena",
                "Competitive • 144 FPS"
            )}

            ${gameCard(
                "Nebula Racing",
                "Racing • Ultra"
            )}

            ${gameCard(
                "Apollo Test Game",
                "Native • Optimized"
            )}

        </div>

    `;

}


function statCard(
    title,
    value
){

    return `

        <div class="card">

            <div class="card-title">
                ${title}
            </div>

            <div class="metric">
                ${value}
            </div>

        </div>

    `;

}


/* =====================================================
   GAME LIBRARY
===================================================== */

function renderGames(){

    document
        .getElementById(
            "content"
        )
        .innerHTML = `

        <h2>
            Game Library
        </h2>

        <p class="subtitle">
            Installed and ready-to-play games.
        </p>


        <div class="games">

            ${gameCard(
                "Cyber Arena",
                "Competitive • 144 FPS"
            )}

            ${gameCard(
                "Nebula Racing",
                "Racing • Ultra"
            )}

            ${gameCard(
                "Starfall",
                "Adventure • High"
            )}

        </div>

    `;

}


function gameCard(
    title,
    description
){

    return `

        <div class="game">

            <small>
                ${description}
            </small>

            <h3>
                ${title}
            </h3>

            <button
                class="play"
                onclick="
                    demoLaunch('${title}')
                "
            >
                PLAY
            </button>

        </div>

    `;

}


/* =====================================================
   STORE
===================================================== */

function renderStore(
    search = "",
    genre = "All"
){

    let results =
        storeGames;


    if(search.trim()){

        const q =
            search
                .toLowerCase();


        results =
            results.filter(
                game =>
                    game.title
                        .toLowerCase()
                        .includes(q)
            );

    }


    if(genre !== "All"){

        results =
            results.filter(
                game =>
                    game.genre === genre
            );

    }


    const visible =
        results.slice(0,60);


    document
        .getElementById(
            "content"
        )
        .innerHTML = `

        <h2>
            🛍️ APOLLO GAME STORE
        </h2>

        <p class="subtitle">

            Discover
            ${APOLLO_GAME_COUNT.toLocaleString()}
            catalog entries.

        </p>


        <div class="store-toolbar">

            <input
                id="storeSearch"
                class="store-search"
                placeholder="
                    Search 50,000 games...
                "
                value="${escapeHTML(search)}"
                oninput="storeSearchChanged()"
            >


            <select
                id="genreFilter"
                class="store-select"
                onchange="storeFilterChanged()"
            >

                <option>
                    All
                </option>

                ${
                    genres.map(
                        g =>
                        `
                        <option
                            ${
                                g === genre
                                ? "selected"
                                : ""
                            }
                        >
                            ${g}
                        </option>
                        `
                    ).join("")
                }

            </select>

        </div>


        <div class="card store-count">

            <strong>
                ${results.length.toLocaleString()}
            </strong>

            <span class="subtitle">
                games found
            </span>

        </div>


        <div class="games">

            ${
                visible.length
                ?
                visible
                    .map(
                        storeGameCard
                    )
                    .join("")
                :
                `
                <div class="card">
                    No games found.
                </div>
                `
            }

        </div>


        ${
            results.length > 60
            ?
            `
            <p
                class="subtitle"
                style="
                    text-align:center;
                    margin:30px;
                "
            >
                Showing 60 results.
                Refine your search to find more.
            </p>
            `
            :
            ""
        }

    `;

}


function storeGameCard(
    game
){

    const installed =
        installedGames.has(
            game.id
        );


    const wished =
        wishlist.has(
            game.id
        );


    const price =
        game.price === 0
            ? "FREE"
            : "$" + game.price;


    return `

        <div class="game">

            <div
                style="
                    position:absolute;
                    top:15px;
                    left:18px;
                    font-weight:800;
                "
            >
                ${price}
            </div>


            <small>
                ${game.genre}
                • ⭐ ${game.rating}
            </small>


            <h3>
                ${game.title}
            </h3>


            <small>
                ${game.compatibility}
            </small>


            <div
                style="
                    display:flex;
                    gap:7px;
                    margin-top:10px;
                "
            >

                <button
                    class="play"
                    onclick="
                        storeAction(
                            ${game.id}
                        )
                    "
                >

                    ${
                        installed
                        ? "PLAY"
                        : "INSTALL"
                    }

                </button>


                <button
                    onclick="
                        toggleWishlist(
                            ${game.id}
                        )
                    "
                    style="
                        padding:8px 11px;
                        border:0;
                        border-radius:8px;
                        background:#273247;
                        color:white;
                    "
                >

                    ${
                        wished
                        ? "♥"
                        : "♡"
                    }

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   STORE ACTION
===================================================== */

function storeAction(id){

    const game =
        storeGames.find(
            g =>
            g.id === id
        );


    if(!game)
        return;


    if(
        installedGames.has(
            id
        )
    ){

        launchInstalledGame(
            game
        );

    }else{

        installGame(
            game
        );

    }

}


/* =====================================================
   INSTALL
===================================================== */

function installGame(
    game
){

    openModal(`

        <div class="card-title">
            APOLLO INSTALLER
        </div>

        <h2>
            Installing ${game.title}
        </h2>

        <p class="subtitle">
            Preparing APOLLO Game Runtime...
        </p>


        <div
            class="progress"
            style="margin-top:20px"
        >

            <div
                id="installBar"
                style="width:0%"
            ></div>

        </div>


        <p
            id="installText"
            class="subtitle"
        >
            0%
        </p>

    `);


    let progress = 0;


    const timer =
        setInterval(
            () => {

                progress +=
                    Math.floor(
                        Math.random()*12
                    ) + 5;


                if(progress >= 100){

                    progress = 100;

                    clearInterval(
                        timer
                    );


                    installedGames.add(
                        game.id
                    );


                    openModal(`

                        <div class="card-title">
                            INSTALLATION COMPLETE
                        </div>

                        <h2>
                            ${game.title}
                        </h2>

                        <p class="subtitle">
                            The game is ready.
                        </p>

                        <button
                            class="primary"
                            onclick="
                                closeModal();
                                launchInstalledGame(
                                    storeGames.find(
                                        g =>
                                        g.id ===
                                        ${game.id}
                                    )
                                );
                            "
                        >
                            PLAY NOW
                        </button>

                    `);


                    renderStore();

                    return;

                }


                const bar =
                    document.getElementById(
                        "installBar"
                    );


                const text =
                    document.getElementById(
                        "installText"
                    );


                if(bar)
                    bar.style.width =
                        progress + "%";


                if(text)
                    text.textContent =
                        progress + "%";


            },
            250
        );

}


/* =====================================================
   LAUNCH
===================================================== */

function launchInstalledGame(
    game
){

    gamingMode = true;


    openModal(`

        <div class="card-title">
            APOLLO GAME RUNTIME
        </div>

        <h2>
            ${game.title}
        </h2>

        <p class="subtitle">
            Game session started.
        </p>


        <div class="grid">

            ${statCard(
                "GPU",
                "ACTIVE"
            )}

            ${statCard(
                "GAMING MODE",
                "ON"
            )}

            ${statCard(
                "FPS",
                "144"
            )}

            ${statCard(
                "RUNTIME",
                "APOLLO"
            )}

        </div>


        <p class="subtitle">
            In the final APOLLO OS,
            this runtime will hand execution
            to the actual installed game.
        </p>

    `);

}


/* =====================================================
   DEMO GAME
===================================================== */

function demoLaunch(
    title
){

    notification(
        "Launching " + title
    );

    gamingMode = true;

    setTimeout(
        () =>
        notification(
            "Gaming Mode enabled"
        ),
        500
    );

}


/* =====================================================
   WISHLIST
===================================================== */

function toggleWishlist(
    id
){

    if(
        wishlist.has(id)
    ){

        wishlist.delete(id);

    }else{

        wishlist.add(id);

    }


    renderStore();

}


/* =====================================================
   SEARCH
===================================================== */

let searchTimer;


function storeSearchChanged(){

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            () => {

                const search =
                    document
                        .getElementById(
                            "storeSearch"
                        ).value;


                const genre =
                    document
                        .getElementById(
                            "genreFilter"
                        ).value;


                renderStore(

                    genre
                );

            },
            180
        );

}


function storeFilterChanged(){

    const search =
        document
            .getElementById(
                "storeSearch"
            ).value;


    const genre =
        document
            .getElementById(
                "genreFilter"
            ).value;


    renderStore(
        search,
        genre
    );

}


/* =====================================================

function randomValue(
    min,
    max
){

    return Math.floor(
        Math.random() *
        (max-min+1)
        + min
    );

}

        );

            ${performanceCard(

}

/* =====================================================
   GAMING MODE
===================================================== */

function toggleGamingMode(){

    gamingMode =
        !gamingMode;


    notification(
        "Gaming Mode " +
        (
            gamingMode
            ? "enabled"
            : "disabled"
        )
    );


    if(
        currentPage ===
        "home"
    )
        renderHome();


    if(
        currentPage ===
        "performance"
    )
        renderPerformance();

}


/* =====================================================
   MODAL
===================================================== */

function openModal(
    html
){

    document
        .getElementById(
            "modalContent"
        )
        .innerHTML =
        html;


    document
        .getElementById(
            "modal"
        )
        .style.display =
        "flex";

}


function closeModal(){

    document
        .getElementById(
            "modal"
        )
        .style.display =
        "none";

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function notification(
    message
){

    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast";


    toast.textContent =
        message;


    document
        .body
        .appendChild(
            toast
        );


    setTimeout(
        () =>
        toast.remove(),
        2200
    );

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(
    value
){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
